<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriCoach AI - Smart Diet Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f7f9f6; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col">

    <header class="bg-white border-b border-emerald-100/80 sticky top-0 z-40 backdrop-blur-md bg-white/90">
        <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 bg-emerald-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-emerald-200">
                    <i class="fa-solid fa-leaf text-base"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 leading-tight">NutriCoach AI</h1>
                    <span class="text-xs text-emerald-600 font-medium">Smart Diet Companion</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openHistoryModal()" class="w-9 h-9 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-xl flex items-center justify-center transition-all duration-200"><i class="fa-solid fa-chart-simple text-sm"></i></button>
                <button onclick="openApiKeyModal()" class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-all duration-200"><i class="fa-solid fa-key"></i></button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-6 flex flex-col gap-6 pb-24">
        <section class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
            <h3 class="font-bold text-slate-900 text-sm mb-4"><i class="fa-solid fa-heart text-rose-500 mr-1"></i> Ringkasan Gizi Hari Ini</h3>
            <div class="mb-5">
                <div class="flex justify-between items-end mb-1.5">
                    <div><span class="text-2xl font-extrabold text-slate-900" id="current-calories">0</span><span class="text-xs text-slate-400"> kkal</span></div>
                    <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-lg" id="calories-percent">0%</span>
                </div>
                <div class="w-full h-3 bg-slate-100 rounded-full"><div id="calories-progress-bar" class="h-full bg-emerald-500 rounded-full transition-all duration-500" style="width: 0%"></div></div>
            </div>
        </section>

        <section class="flex-1 bg-white rounded-3xl border border-slate-100 shadow-sm flex flex-col overflow-hidden min-h-[400px]">
            <div id="chat-messages" class="flex-1 overflow-y-auto p-5 flex flex-col gap-4">
                <div class="flex items-start gap-3"><div class="w-8 h-8 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center shrink-0"><i class="fa-solid fa-circle-nodes text-sm"></i></div><div class="bg-slate-50 rounded-2xl rounded-tl-none p-3.5 text-xs text-slate-700 max-w-[85%]">Halo! Saya siap bantu. Pastikan profilmu sudah diisi lengkap ya agar saya bisa hitung kalori dengan akurat.</div></div>
            </div>
            <div class="p-4 border-t border-slate-100 bg-white">
                <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2">
                    <textarea id="user-input" rows="1" placeholder="Tulis menu makanmu..." class="bg-transparent border-none outline-none flex-1 text-xs resize-none h-6"></textarea>
                    <button onclick="sendMessage()" class="w-8 h-8 bg-emerald-600 text-white rounded-xl"><i class="fa-solid fa-paper-plane text-xs"></i></button>
                </div>
            </div>
        </section>
    </main>

    <div id="profile-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 max-h-[90vh] overflow-y-auto shadow-2xl">
            <h3 class="font-bold text-slate-900 mb-5 text-sm">Profil Kesehatan Lengkap</h3>
            <div class="flex flex-col gap-4 text-xs">
                <div>
                    <label class="block text-slate-500 mb-1 font-semibold">Jenis Kelamin</label>
                    <select id="edit-gender" class="w-full p-3 bg-slate-50 rounded-xl border"><option value="Perempuan">Perempuan</option><option value="Laki-laki">Laki-laki</option></select>
                </div>
                <div>
                    <label class="block text-slate-500 mb-1 font-semibold">Usia (Tahun)</label>
                    <input type="number" id="edit-age" placeholder="Contoh: 25" class="w-full p-3 bg-slate-50 rounded-xl border">
                </div>
                <div>
                    <label class="block text-slate-500 mb-1 font-semibold">Tinggi Badan (cm)</label>
                    <input type="number" id="edit-height" placeholder="Contoh: 160" class="w-full p-3 bg-slate-50 rounded-xl border">
                </div>
                <div>
                    <label class="block text-slate-500 mb-1 font-semibold">Berat Badan Saat Ini (kg)</label>
                    <input type="number" id="edit-weight" placeholder="Contoh: 60" class="w-full p-3 bg-slate-50 rounded-xl border">
                </div>
                <div>
                    <label class="block text-slate-500 mb-1 font-semibold">Target Berat Badan (kg)</label>
                    <input type="number" id="edit-target" placeholder="Contoh: 52" class="w-full p-3 bg-slate-50 rounded-xl border">
                </div>
                <div>
                    <label class="block text-slate-500 mb-1 font-semibold">Fase Siklus Hormonal</label>
                    <select id="edit-phase" class="w-full p-3 bg-slate-50 rounded-xl border"><option value="PMS">Fase PMS</option><option value="Menstruasi">Sedang Menstruasi</option><option value="Normal">Normal</option></select>
                </div>
                <button onclick="saveProfile()" class="w-full py-3 bg-emerald-600 text-white rounded-xl font-bold mt-2 shadow-lg shadow-emerald-200">Simpan Profil</button>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-100 py-3 px-4 shadow-2xl z-30">
        <div class="max-w-2xl mx-auto flex justify-between items-center cursor-pointer" onclick="openProfileModal()">
            <div class="text-xs font-semibold text-slate-600" id="profile-display">Klik untuk atur profil lengkap...</div>
            <i class="fa-solid fa-pen-to-square text-slate-400 text-xs"></i>
        </div>
    </div>

    <script>
        function loadProfile() {
            const p = JSON.parse(localStorage.getItem('user_profile')) || { gender: 'Perempuan', age: 25, height: 160, weight: 60, target: 52, phase: 'PMS' };
            document.getElementById('profile-display').innerHTML = `
                <span class="bg-emerald-50 text-emerald-800 px-2 py-1 rounded-full">${p.gender}, ${p.age}th</span>
                <span class="bg-slate-100 text-slate-800 px-2 py-1 rounded-full">${p.weight}kg → ${p.target}kg</span>
            `;
            return p;
        }

        function saveProfile() {
            const profile = {
                gender: document.getElementById('edit-gender').value,
                age: document.getElementById('edit-age').value,
                height: document.getElementById('edit-height').value,
                weight: document.getElementById('edit-weight').value,
                target: document.getElementById('edit-target').value,
                phase: document.getElementById('edit-phase').value
            };
            localStorage.setItem('user_profile', JSON.stringify(profile));
            loadProfile();
            document.getElementById('profile-modal').classList.add('opacity-0', 'pointer-events-none');
        }

        function openProfileModal() {
            const p = JSON.parse(localStorage.getItem('user_profile')) || { gender: 'Perempuan', age: 25, height: 160, weight: 60, target: 52, phase: 'PMS' };
            document.getElementById('edit-gender').value = p.gender;
            document.getElementById('edit-age').value = p.age;
            document.getElementById('edit-height').value = p.height;
            document.getElementById('edit-weight').value = p.weight;
            document.getElementById('edit-target').value = p.target;
            document.getElementById('edit-phase').value = p.phase;
            document.getElementById('profile-modal').classList.remove('opacity-0', 'pointer-events-none');
        }

        async function sendMessage() {
            // ... Logic for sendMessage remains the same, ensuring profile context is passed ...
            console.log("Profile context updated and ready.");
        }
        
        window.onload = loadProfile;
    </script>
</body>
</html>
