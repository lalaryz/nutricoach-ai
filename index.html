<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>NutriCoach AI Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen pb-20">
    <div class="max-w-xl mx-auto p-4 space-y-4">
        <div class="flex justify-between items-center">
            <h1 class="font-bold text-lg text-emerald-700">NutriCoach AI</h1>
            <div class="flex gap-2">
                <button onclick="document.getElementById('modal-riwayat').classList.remove('hidden')" class="bg-white p-2 rounded-xl shadow text-xs">📅</button>
                <button onclick="document.getElementById('modal-profil').classList.remove('hidden')" class="bg-emerald-600 text-white p-2 px-4 rounded-xl text-xs font-bold">Profil</button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl border shadow-sm">
            <div class="grid grid-cols-2 gap-4 text-center">
                <div class="bg-emerald-50 p-4 rounded-2xl">Cal: <span id="v-cal" class="font-bold block text-lg">0</span></div>
                <div class="bg-blue-50 p-4 rounded-2xl">Prot: <span id="v-prot" class="font-bold block text-lg">0g</span></div>
            </div>
        </div>

        <div id="chat" class="h-80 overflow-y-auto space-y-4 p-2 text-xs">
            <div class="bg-slate-200 p-3 rounded-2xl">Halo! Saya coach gizimu. Apa yang kamu makan hari ini? Ceritakan juga perasaanmu.</div>
        </div>

        <div class="fixed bottom-4 left-0 right-0 max-w-xl mx-auto px-4 flex gap-2">
            <input type="file" id="img-input" class="hidden" accept="image/*">
            <button onclick="document.getElementById('img-input').click()" class="bg-slate-800 text-white px-4 rounded-xl">📷</button>
            <input id="user-input" class="flex-1 p-4 rounded-xl border shadow" placeholder="Ketik atau scan makanan...">
            <button onclick="handleSend()" class="bg-emerald-600 text-white px-6 rounded-xl font-bold">Kirim</button>
        </div>
    </div>

    <div id="modal-profil" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white p-6 rounded-3xl w-full max-w-sm space-y-3">
            <h3 class="font-bold">Profil Kesehatan</h3>
            <input type="number" id="p-age" placeholder="Usia" class="w-full p-2 bg-slate-100 rounded-lg">
            <input type="number" id="p-weight" placeholder="Berat (kg)" class="w-full p-2 bg-slate-100 rounded-lg">
            <select id="p-fase" class="w-full p-2 bg-slate-100 rounded-lg">
                <option value="Folikular">Fase Folikular</option>
                <option value="Ovulasi">Fase Ovulasi</option>
                <option value="Luteal">Fase Luteal</option>
                <option value="Menstruasi">Sedang Menstruasi</option>
            </select>
            <div class="grid grid-cols-2 gap-2 text-xs" id="checklist-medis">
                <label><input type="checkbox" value="GERD"> GERD</label>
                <label><input type="checkbox" value="Maag"> Maag</label>
                <label><input type="checkbox" value="Kolesterol"> Kolesterol</label>
                <label><input type="checkbox" value="Diabetes"> Diabetes</label>
                <label><input type="checkbox" value="PCOS"> PCOS</label>
            </div>
            <button onclick="saveProfile()" class="w-full bg-emerald-600 text-white p-3 rounded-xl font-bold">Simpan</button>
        </div>
    </div>

    <div id="modal-riwayat" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-3xl w-full max-w-sm h-80 overflow-y-auto">
            <h3 class="font-bold mb-4">Riwayat Kalori</h3>
            <div id="list-riwayat" class="text-sm"></div>
            <button onclick="document.getElementById('modal-riwayat').classList.add('hidden')" class="w-full mt-4 bg-slate-200 p-3 rounded-xl">Tutup</button>
        </div>
    </div>

    <script>
        // Logika Data
        function saveProfile() {
            const data = {
                age: document.getElementById('p-age').value,
                weight: document.getElementById('p-weight').value,
                fase: document.getElementById('p-fase').value,
                medis: Array.from(document.querySelectorAll('#checklist-medis input:checked')).map(i => i.value)
            };
            localStorage.setItem('user_profile', JSON.stringify(data));
            document.getElementById('modal-profil').classList.add('hidden');
            alert("Profil diperbarui!");
        }

        async function handleSend() {
            const input = document.getElementById('user-input');
            const key = localStorage.getItem('gemini_key') || prompt("Masukkan API Key Google AI Studio:");
            if(key) localStorage.setItem('gemini_key', key);
            
            const profile = JSON.parse(localStorage.getItem('user_profile') || '{}');
            
            // Kirim ke AI dengan konteks lengkap
            const promptAI = `Role: NutriCoach. Profil: ${JSON.stringify(profile)}. 
            Input user: ${input.value}. 
            Instruksi: Berikan saran berdasarkan kondisi medis dan fase siklus. Akhiri dengan pertanyaan suportif. 
            Output format JSON murni: {"cal":0, "prot":0}`;

            // (Lanjutkan dengan fetch ke API Gemini...)
            // ... (logika update UI dan simpan riwayat sama seperti sebelumnya) ...
            input.value = '';
        }
    </script>
</body>
</html>
