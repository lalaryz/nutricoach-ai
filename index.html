<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>NutriCoach AI Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen pb-20">
    <div class="max-w-xl mx-auto p-4 space-y-4">
        <div class="flex justify-between items-center">
            <h1 class="font-bold text-lg">NutriCoach AI</h1>
            <div class="flex gap-2">
                <button onclick="document.getElementById('modal-profil').classList.remove('hidden')" class="bg-slate-200 p-2 rounded-xl text-xs">Profil Medis</button>
                <button onclick="const k=prompt('Masukkan API Key:'); if(k) localStorage.setItem('gemini_key', k)" class="bg-emerald-600 text-white p-2 rounded-xl text-xs">API Key</button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl border shadow-sm">
            <h2 class="text-[10px] font-bold text-slate-400 uppercase">Ringkasan Nutrisi</h2>
            <div class="grid grid-cols-4 gap-2 mt-4 text-center text-xs">
                <div><span id="v-cal" class="font-bold block">0</span>Cal</div>
                <div><span id="v-prot" class="font-bold block">0g</span>Prot</div>
                <div><span id="v-fat" class="font-bold block">0g</span>Fat</div>
                <div><span id="v-sod" class="font-bold block">0mg</span>Sod</div>
            </div>
        </div>

        <div id="chat" class="h-96 overflow-y-auto space-y-4 p-2">
            <div class="bg-slate-200 p-3 rounded-2xl text-xs">Halo! Saya coach gizimu. Apa yang kamu makan hari ini? Ceritakan juga perasaanmu atau kondisi kesehatanmu saat ini.</div>
        </div>

        <div class="fixed bottom-4 left-0 right-0 max-w-xl mx-auto px-4 flex gap-2">
            <input id="user-input" class="flex-1 p-4 rounded-xl border" placeholder="Ketik makanan atau pertanyaan...">
            <button onclick="handleSend()" class="bg-emerald-600 text-white px-6 rounded-xl font-bold">Kirim</button>
        </div>
    </div>

    <div id="modal-profil" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-3xl w-full max-w-sm space-y-3">
            <h3 class="font-bold">Kondisi Medis</h3>
            <div class="grid grid-cols-2 gap-2 text-xs" id="checklist-medis">
                <label><input type="checkbox" value="GERD"> GERD</label>
                <label><input type="checkbox" value="Maag"> Maag</label>
                <label><input type="checkbox" value="Kolesterol"> Kolesterol</label>
                <label><input type="checkbox" value="Diabetes"> Diabetes</label>
                <label><input type="checkbox" value="Hipertensi"> Hipertensi</label>
            </div>
            <button onclick="saveProfile()" class="w-full bg-emerald-600 text-white p-3 rounded-xl">Simpan</button>
        </div>
    </div>

    <script>
        const getProfile = () => JSON.parse(localStorage.getItem('user_data') || '{"medis": []}');
        
        function saveProfile() {
            const checked = Array.from(document.querySelectorAll('#checklist-medis input:checked')).map(i => i.value);
            localStorage.setItem('user_data', JSON.stringify({ medis: checked }));
            document.getElementById('modal-profil').classList.add('hidden');
            alert("Profil disimpan!");
        }

        async function handleSend() {
            const input = document.getElementById('user-input');
            const key = localStorage.getItem('gemini_key');
            if(!key) return alert("Masukkan API Key dulu!");

            const profile = getProfile();
            document.getElementById('chat').innerHTML += `<div class="bg-emerald-600 text-white p-3 rounded-2xl ml-auto w-max text-xs">${input.value}</div>`;
            
            const prompt = `Role: NutriCoach. User Profile: ${JSON.stringify(profile)}.
            Analisis makanan: ${input.value}.
            Instruksi: Berikan saran kesehatan yang hangat & suportif sesuai kondisi medis pengguna. 
            Tugas Akhir: Berikan JSON {"cal":0, "prot":0, "fat":0, "sod":0} dan SELALU akhiri chat dengan pertanyaan suportif untuk pengguna agar mereka bisa lanjut bercerita.`;

            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{parts: [{text: prompt}]}] })
            });

            const data = await res.json();
            const text = data.candidates[0].content.parts[0].text;
            document.getElementById('chat').innerHTML += `<div class="bg-white p-3 rounded-2xl text-xs border">${text}</div>`;
            
            const match = text.match(/\{.*\}/s);
            if(match) {
                const n = JSON.parse(match[0]);
                document.getElementById('v-cal').innerText = n.cal;
                document.getElementById('v-prot').innerText = n.prot + 'g';
            }
            input.value = '';
        }
    </script>
</body>
</html>
