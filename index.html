<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriCoach AI Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f7f9f6; }</style>
</head>
<body class="min-h-screen pb-24">

    <header class="bg-white sticky top-0 z-40 border-b border-emerald-100">
        <div class="max-w-xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="font-bold text-slate-800">NutriCoach <span class="text-emerald-600">AI</span></h1>
            <button onclick="document.getElementById('profile-modal').classList.remove('hidden')" class="text-xs bg-slate-900 text-white px-3 py-2 rounded-xl">Profil</button>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 py-6 space-y-6">
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-emerald-50">
            <h2 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Dashboard Nutrisi</h2>
            <div id="hormone-badge" class="mt-2 inline-block bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full text-[10px] font-bold">Fase: Loading...</div>
            <div class="grid grid-cols-4 gap-2 mt-4 text-center">
                <div class="bg-slate-50 p-2 rounded-xl"><span id="v-cal" class="block font-bold">0</span><small class="text-[8px]">Cal</small></div>
                <div class="bg-slate-50 p-2 rounded-xl"><span id="v-prot" class="block font-bold">0</span><small class="text-[8px]">Prot</small></div>
                <div class="bg-slate-50 p-2 rounded-xl"><span id="v-fat" class="block font-bold">0</span><small class="text-[8px]">Fat</small></div>
                <div class="bg-slate-50 p-2 rounded-xl"><span id="v-sod" class="block font-bold">0</span><small class="text-[8px]">Sod</small></div>
            </div>
        </div>

        <div id="chat" class="space-y-4 h-[350px] overflow-y-auto px-2"></div>
    </main>

    <footer class="fixed bottom-0 w-full bg-white p-4 border-t">
        <div class="max-w-xl mx-auto flex gap-2">
            <input type="file" id="img-input" class="hidden" accept="image/*">
            <button onclick="document.getElementById('img-input').click()" class="bg-slate-100 px-4 rounded-xl">📷</button>
            <input id="user-input" class="flex-1 bg-slate-50 p-4 rounded-xl text-xs" placeholder="Ceritakan makanmu hari ini...">
            <button onclick="handleSend()" class="bg-emerald-600 text-white px-6 rounded-xl font-bold">Kirim</button>
        </div>
    </footer>

    <div id="profile-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-3xl w-full max-w-sm space-y-4">
            <h3 class="font-bold">Pengaturan Profil</h3>
            <select id="p-fase" class="w-full p-3 bg-slate-50 rounded-xl">
                <option>Folikular</option><option>Ovulasi</option><option>Luteal</option><option>Menstruasi</option>
            </select>
            <input id="p-kondisi" class="w-full p-3 bg-slate-50 rounded-xl" placeholder="Kondisi Medis (misal: GERD)">
            <button onclick="saveProfile()" class="w-full py-3 bg-emerald-600 text-white rounded-xl font-bold">Simpan</button>
        </div>
    </div>

    <script>
        // Init
        const getProfile = () => JSON.parse(localStorage.getItem('user_profile') || '{"fase":"Folikular", "kondisi":"tidak ada"}');
        const updateUI = () => document.getElementById('hormone-badge').innerText = "Fase: " + getProfile().fase;
        updateUI();

        function saveProfile() {
            localStorage.setItem('user_profile', JSON.stringify({ fase: document.getElementById('p-fase').value, kondisi: document.getElementById('p-kondisi').value }));
            document.getElementById('profile-modal').classList.add('hidden');
            updateUI();
        }

        async function handleSend() {
            const input = document.getElementById('user-input');
            const apiKey = localStorage.getItem('gemini_api_key') || 'ISI_API_KEY_KAMU';
            if(!input.value) return;

            document.getElementById('chat').innerHTML += `<div class="bg-emerald-600 text-white p-3 rounded-2xl ml-auto w-max text-xs">${input.value}</div>`;
            
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    contents: [{parts: [{text: `Role: Nutrition Coach. Profil: ${JSON.stringify(getProfile())}. Analisis: ${input.value}. Output Wajib: Akhiri dengan JSON format: {"cal":0, "prot":0, "fat":0, "sod":0}`}]}]
                })
            });

            const data = await response.json();
            const text = data.candidates[0].content.parts[0].text;
            document.getElementById('chat').innerHTML += `<div class="bg-white p-4 rounded-2xl border text-xs shadow-sm">${text}</div>`;
            
            const match = text.match(/\{.*\}/s);
            if(match) {
                const n = JSON.parse(match[0]);
                document.getElementById('v-cal').innerText = n.cal;
                document.getElementById('v-prot').innerText = n.prot;
                document.getElementById('v-fat').innerText = n.fat;
                document.getElementById('v-sod').innerText = n.sod;
            }
            input.value = '';
        }
    </script>
</body>
</html>
